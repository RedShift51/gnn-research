name: Build and push serverless image

# ubuntu-latest runners are native amd64 — the same architecture RunPod's GPU hosts run.
# No QEMU/cross-compilation needed here, unlike building this image on an Apple Silicon Mac.
on:
  push:
    branches: [main]
    # The image no longer COPYs application code in (see Dockerfile/entrypoint.sh — code is
    # pulled from GitHub at container start instead), so only things that actually change the
    # image itself need a rebuild: the Dockerfile, entrypoint.sh, and Python dependencies.
    # data/**, models/**, training/**, evaluation/**, configs/** changes take effect on the next
    # worker spin-up with NO rebuild.
    paths:
      - "fraud-diffusion/serverless/Dockerfile"
      - "fraud-diffusion/serverless/entrypoint.sh"
      - "fraud-diffusion/requirements.txt"
      - ".github/workflows/build-serverless-image.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        # ubuntu-latest only has ~14GB free by default — not enough for a CUDA devel base image
        # plus GHA cache export. This removes preinstalled toolchains we don't use (.NET,
        # Android SDK, Haskell, etc.) to reclaim space before the build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fraud-diffusion
          file: fraud-diffusion/serverless/Dockerfile
          push: true
          tags: ghcr.io/redshift51/fraud-diffusion-serverless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
