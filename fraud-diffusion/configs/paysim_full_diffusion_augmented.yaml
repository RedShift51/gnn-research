seed: 42

data:
  raw_csv: data/raw/paysim.csv
  processed_path: data/processed/paysim_graph_full.pt
  augmented_processed_path: data/processed/paysim_graph_full_diffusion_augmented.pt
  fraud_types: [TRANSFER, CASH_OUT]
  subsample_size: 5000000
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

diffusion:
  num_timesteps: 1000        # standard DDPM default
  hidden_dim: 128
  lr: 0.001
  epochs: 1000               # real budget — smoke test (Run 23) only used 30 to check mechanics
  batch_size: 256
  log_every: 25
  model_path: models/diffusion/tabddpm_paysim_full.pt

augment:
  n_synthetic: 3643          # roughly doubles train-fraud representation (3643 real -> 7286 total)
  sampler: ddim              # deterministic, far fewer forward passes than full ddpm_sample
  ddim_steps: 50
  k_connections: 5           # each synthetic fraud node attached to 5 random real TRAIN nodes

# Same architecture/hyperparameters as Run 11 (the honest no-augmentation baseline, F1=0.859,
# AUC=0.962) — only the training DATA differs (augmented graph), so any difference in result is
# attributable to the diffusion augmentation itself, not a confounded hyperparameter change.
model:
  name: graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: full_graphsage_tabddpm_diffusion_augmented
