seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  augmented_processed_path: data/processed/elliptic_graph_diffusion_best_all_augmented.pt
  train_end_step: 34
  val_end_step: 41

diffusion:
  num_timesteps: 1000
  hidden_dim: 128
  lr: 0.001
  epochs: 1000
  batch_size: 256
  log_every: 25
  model_path: models/diffusion/tabddpm_elliptic_best_all.pt

augment:
  n_synthetic: 1731    # Run 39's best point
  sampler: ddim
  ddim_steps: 100       # Run 40's best point
  clamp_std: 3.0
  k_connections: 5
  attach_to: all        # default random-heuristic wiring, the counterpart to attach_to=template

# alpha=0.75, n_synthetic=1731, ddim_steps=100 -- best-known recipe (Runs 39/40), attach_to=all
# (explicit, not just relying on the default) -- the multi-seed comparison baseline against
# configs/elliptic_diffusion_template.yaml (see Run 44's single-seed, ambiguous result).
model:
  name: graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.75
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_graphsage_tabddpm_best_all_alpha075
