seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# GraphSAGEDiff encoder trained via triplet loss (metric learning) instead of a classification
# head, classified post-hoc by nearest centroid (fraud centroid vs legit/normal centroid) in the
# learned embedding space. Direct empirical test of whether this fares better than raw-feature
# nearest-neighbor (Run 76) or CORAL domain adaptation (Run 77) against the regime-break "hard
# core" -- both of those failed; this tests whether a GNN-learned, imbalance-robust metric space
# does any better, rather than assuming it fails for the same reason. 2026-07-21 discussion.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto

metric_learning:
  enabled: true
  n_triplets_per_epoch: 2000
  margin: 1.0

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_metric_learning
