seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  augmented_processed_path: data/processed/elliptic_graph_diffusion_augmented.pt
  train_end_step: 34
  val_end_step: 41

diffusion:
  num_timesteps: 1000
  hidden_dim: 128
  lr: 0.001
  epochs: 1000
  batch_size: 256
  log_every: 25
  model_path: models/diffusion/tabddpm_elliptic.pt

augment:
  n_synthetic: 3462   # roughly doubles train-fraud (3462 real train-fraud on Elliptic, Run 26/29)
  sampler: ddim
  ddim_steps: 50
  k_connections: 5

# Part of an alpha sweep (0.25/0.40/0.50/0.60/0.75/0.85, plus the existing 0.95 point from Run 32)
# to find where diffusion+alpha starts to overshoot on Elliptic specifically (see Run 32's
# root-cause analysis: alpha=0.95+diffusion pushed predicted-positive rate to 44.5% vs a true
# 4.6% rate).
model:
  name: graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.85
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_graphsage_tabddpm_alpha085
