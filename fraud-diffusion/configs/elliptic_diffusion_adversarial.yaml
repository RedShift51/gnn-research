seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  augmented_processed_path: data/processed/elliptic_graph_diffusion_adversarial_augmented.pt
  train_end_step: 34
  val_end_step: 41

diffusion:
  num_timesteps: 1000
  hidden_dim: 128
  lr: 0.001
  epochs: 1000
  batch_size: 256
  log_every: 25
  model_path: models/diffusion/tabddpm_elliptic_adversarial.pt
  # Adversarial fine-tuning phase, per 2026-07-21 discussion: a discriminator scores real vs
  # synthetic (the denoiser's one-step x0 estimate, not a full multi-step sample — see
  # GaussianDiffusion.predict_x0), and the denoiser also tries to fool it.
  # L_total = L_denoise + lambda_adv * L_adversarial. Starts at epoch 500/1000 (the midpoint), NOT
  # from epoch 1 — an adversarial signal against a still-near-random early denoiser destabilizes
  # both networks; the denoiser needs to already be reasonably good first. Expect the denoise loss
  # to bump up once this kicks in (see the 20-epoch local smoke test) — the open question is
  # whether it settles into an improvement by epoch 1000 or just stays destabilized.
  adversarial:
    enabled: true
    start_epoch: 500
    lambda_adv: 0.1
    discriminator_hidden_dim: 128

augment:
  n_synthetic: 1731   # Run 39's best point (half of the ~2x-real-fraud default)
  sampler: ddim
  ddim_steps: 50
  k_connections: 5
  clamp_std: 3.0       # Run 36's established best

# alpha=0.75, n_synthetic=1731, k_connections=5, clamp_std=3 -- Run 39's best point overall
# (Test F1=0.7635 without adversarial loss). This config tests whether adversarial fine-tuning of
# the diffusion step improves on that, holding everything else fixed.
model:
  name: graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.75
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_graphsage_tabddpm_adversarial_alpha075
