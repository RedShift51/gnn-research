seed: 42

data:
  raw_csv: data/raw/paysim.csv
  processed_path: data/processed/paysim_graph_full.pt   # shares the same processed graph as GraphSAGE
  fraud_types: [TRANSFER, CASH_OUT]
  subsample_size: 5000000
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

model:
  name: gat
  hidden_dim: 64     # GAT concatenates heads, so effective width = hidden_dim * heads
  num_layers: 2
  heads: 8           # standard GAT default (Velickovic et al. 2018)
  dropout: 0.6       # standard GAT regularization value (higher than GraphSAGE's 0.5)

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.005          # GAT papers typically use a higher lr than GraphSAGE
  weight_decay: 0.0005
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.999
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: full_gat_paysim_runpod_4090
