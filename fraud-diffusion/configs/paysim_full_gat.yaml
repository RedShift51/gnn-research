seed: 42

data:
  raw_csv: data/raw/paysim.csv
  processed_path: data/processed/paysim_graph_full.pt   # shares the same processed graph as GraphSAGE
  fraud_types: [TRANSFER, CASH_OUT]
  subsample_size: 5000000
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

model:
  name: gat
  # Full-batch GAT materializes per-edge, per-head attention features: on this graph
  # (28.3M directed edges) the standard hidden_dim=64/heads=8 (effective concat width 512)
  # tried to allocate ~59GB and OOM'd on a 24GB RTX 4090. GraphSAGE only aggregates
  # (sum/mean), so it doesn't hit this — attention is inherently pricier per edge.
  # Cut to hidden_dim=32/heads=4 (concat width 128, ~4x less) to fit; the real long-term
  # fix for scaling GAT further is neighbor-sampled mini-batch training (PyG NeighborLoader)
  # instead of full-batch, not just shrinking the model.
  hidden_dim: 32
  num_layers: 2
  heads: 4
  dropout: 0.6       # standard GAT regularization value (higher than GraphSAGE's 0.5)

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.005          # GAT papers typically use a higher lr than GraphSAGE
  weight_decay: 0.0005
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.999
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: full_gat_paysim_runpod_4090
