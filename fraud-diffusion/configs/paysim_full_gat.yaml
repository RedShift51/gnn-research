seed: 42

data:
  raw_csv: data/raw/paysim.csv
  processed_path: data/processed/paysim_graph_full.pt   # shares the same processed graph as GraphSAGE
  fraud_types: [TRANSFER, CASH_OUT]
  subsample_size: 5000000
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

model:
  name: gat
  # Full-batch GAT materializes per-edge, per-head attention features over the WHOLE graph at
  # once: on this graph (28.3M directed edges) even a shrunk hidden_dim=32/heads=4 OOM'd on both
  # a 24GB RTX 4090 and a 48GB L40S (needed ~48.8GB, had 47.38GB — see LAB_JOURNAL.md). Switched
  # to mini-batch/neighbor-sampling (train.mini_batch below) instead of continuing to shrink the
  # model — that's what actually fixes the scaling problem, and lets us restore full standard
  # capacity (hidden_dim=64/heads=8, Velickovic et al. 2018 defaults) since each batch only
  # touches a small sampled subgraph, not all 28.3M edges at once.
  hidden_dim: 64
  num_layers: 2
  heads: 8
  dropout: 0.6       # standard GAT regularization value (higher than GraphSAGE's 0.5)

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.005          # GAT papers typically use a higher lr than GraphSAGE
  weight_decay: 0.0005
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30
  mini_batch: true
  batch_size: 128        # seed nodes per batch (their loss is what gets backpropagated)
  num_neighbors: [15, 10]  # sampled neighbors per hop, one entry per GNN layer (num_layers=2)

journal:
  path: LAB_JOURNAL.md
  run_name: full_gat_paysim_minibatch
