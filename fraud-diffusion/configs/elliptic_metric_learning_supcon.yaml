seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# Supervised Contrastive Loss (Khosla et al. 2020) -- pulls every anchor toward ALL same-label
# points in a batch and away from ALL different-label points at once, instead of one positive/
# negative per triplet step. Doesn't presuppose a single class-conditional shape the way pulling
# toward one fraud centroid does, so it may handle the camo/obvious bimodality (Run 81) more
# gracefully without an explicit multi-prototype structure.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto

metric_learning:
  enabled: true
  margin: 1.0
  mining: supcon
  temperature: 0.1

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_metric_learning_supcon
