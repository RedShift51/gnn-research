seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# Campaign candidate: camo-weighted + a SMALL compression_weight=0.1 (Run 82 found weight=0.5
# improved aggregate F1 but hurt hard-core recovery -- testing whether a much smaller weight gets
# some of the aggregate benefit without the hard-core cost). Part of a 2026-07-22 hyperparameter
# sweep on top of the confirmed camo-weighted baseline (Run 84).
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto

metric_learning:
  enabled: true
  margin: 1.0
  mining: camo_weighted
  compression_weight: 0.1

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_metric_learning_camo_weighted_comp01
