seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# GraphSAGEDiff (Run 49/50's most promising architectural lead) trained normally; its learned
# node embeddings are then concatenated with raw features and fed into Random Forest instead of
# the GNN's own linear classifier head. See evaluation/gnn_rf_hybrid.py and LAB_JOURNAL.md Run 52.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

hybrid:
  enabled: true
  n_estimators: 300

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_graphsage_diff_rf_hybrid
