seed: 42

data:
  dataset: ieee_cis
  transaction_csv: data/raw/ieee_cis/train_transaction.csv
  identity_csv: data/raw/ieee_cis/train_identity.csv
  processed_path: data/processed/ieee_cis_graph.pt
  subsample_size: null       # null = use all ~590k transactions
  max_node_degree: 20        # same cap as PaySim's build_edges — same over-common-key blowup risk
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

# First honest baseline on this dataset — no diffusion, no augmentation, plain GraphSAGE, matching
# PaySim/Elliptic's own "honest baseline first" convention. 2026-07-21, third-dataset priority.
model:
  name: graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

journal:
  path: LAB_JOURNAL.md
  run_name: ieee_cis_full_graphsage
