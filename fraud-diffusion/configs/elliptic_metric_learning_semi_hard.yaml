seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# Semi-hard negative mining (Schroff et al. 2015, FaceNet) -- the untested middle ground between
# random sampling (Run 78: modest, weak gradient since most triplets already satisfy the margin)
# and pure batch-hard mining (Run 79: F1 crashed to 0.325, unstable "hardest changes every epoch"
# dynamic). For each anchor/positive fraud pair, picks the CLOSEST legit negative that's still
# farther than the positive -- a small but informative gradient without the instability.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto

metric_learning:
  enabled: true
  margin: 1.0
  mining: semi_hard

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_metric_learning_semi_hard
