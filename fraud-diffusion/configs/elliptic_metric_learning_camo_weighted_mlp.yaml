seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# camo_weighted_mlp (2026-07-23): replaces camo_weighted's hand-designed
# softmax(-dist_to_legit) scoring function with a small learned MLP -- input is the anchor's own
# embedding + dist_to_legit + dist_to_fraud + nearest-legit-subcentroid-distance (KMeans over
# CURRENT legit embeddings, richer/more local than the single aggregate legit centroid -- Run 160
# found this fails as a STANDALONE decision rule, but may still help as one feature among several).
# Three stability mitigations on top of the bare mechanism: (1) a 40-epoch warmup where the encoder
# trains on plain unweighted triplet loss while the MLP trains quietly in the background; (2)
# after warmup, ema_weight_mlp is SEEDED from the live MLP's just-warmed-up state (not carried from
# random init) and from then on the encoder's loss is reweighted by this EMA-smoothed shadow copy
# (decay=0.9/epoch), not the raw live one; (3) an anchor regularizer pulling the live MLP's output
# toward the hand-designed formula's own weight.
#
# CORRECTED 2026-07-23 after a first dispatch (anchor weight=0.1): the collapse happened anyway --
# both live and EMA weight-vs-dist_to_legit correlation shot to +0.91 to +0.98 by epoch 25 and
# stayed there (POSITIVE = up-weighting easy/obvious fraud, the exact predicted degenerate
# direction). anchor_weight_coeff=0.1 was far too weak relative to the main per_triplet_loss-driven
# term (same order of magnitude as the loss itself, ~1-4, vs. a squared-weight-difference penalty
# an order of magnitude smaller). Bumped to 2.0 here -- re-verify the correlation diagnostic
# BEFORE trusting any recovery number, same as before.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto

metric_learning:
  enabled: true
  margin: 1.0
  mining: camo_weighted_mlp
  camo_mlp_hidden_dim: 32
  camo_mlp_ema_decay: 0.9
  camo_mlp_warmup_epochs: 40
  camo_mlp_anchor_weight: 2.0
  camo_mlp_subcentroid_k: 15
  # Explicit push for the fraud/legit centroids to separate further -- the margin-based triplet
  # loss saturates (F.relu(...)=0) once satisfied and stops rewarding extra separation; this has
  # no such ceiling. Untested weight -- 0.1 is a starting guess (loss magnitudes are roughly the
  # same order as the triplet loss itself), not a tuned value.
  separation_weight: 0.1

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_metric_learning_camo_weighted_mlp
