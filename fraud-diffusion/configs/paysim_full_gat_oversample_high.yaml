seed: 42

data:
  raw_csv: data/raw/paysim.csv
  processed_path: data/processed/paysim_graph_full.pt
  fraud_types: [TRANSFER, CASH_OUT]
  subsample_size: 5000000
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

model:
  name: gat
  hidden_dim: 64
  num_layers: 2
  heads: 8
  dropout: 0.6

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0

train:
  lr: 0.005
  weight_decay: 0.0005
  epochs: 40
  patience: 8
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 15
  mini_batch: true
  batch_size: 1024
  num_neighbors: [15, 10]
  oversample_fraud_frac: 0.30   # HIGHER than the main config's 0.15 — comparison point

journal:
  path: LAB_JOURNAL.md
  run_name: full_gat_paysim_minibatch_oversample_high
