seed: 42

data:
  dataset: ieee_cis
  transaction_csv: data/raw/ieee_cis/train_transaction.csv
  identity_csv: data/raw/ieee_cis/train_identity.csv
  processed_path: data/processed/ieee_cis_graph.pt
  subsample_size: null
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

# Plain (random-triplet) metric learning on IEEE-CIS, mini-batch (evaluation/metric_learning.py's
# mini_batch path, added 2026-07-22 specifically for this run) -- IEEE-CIS's ~590K-node/41M-edge
# graph makes a full-graph model.embed() call OOM/time out the same way full-batch GraphSAGEDiff
# classification did (see ieee_cis_graphsage_diff_minibatch.yaml). Goal: check whether a camo/
# obvious bimodal split (Elliptic's Run 81 finding) exists in IEEE-CIS's LEARNED embedding space --
# the raw-feature-space check (2026-07-22) found no clean bimodality, but that's not a fair test of
# a model that's never been optimized to organize fraud/legit meaningfully.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  mini_batch: true
  batch_size: 1024
  num_neighbors: [15, 10]

metric_learning:
  enabled: true
  margin: 1.0
  mining: random
  return_embeddings: true
  legit_ref_size: 3000

journal:
  path: LAB_JOURNAL.md
  run_name: ieee_cis_metric_learning
