seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  augmented_processed_path: data/processed/elliptic_graph_gnn_rf_hybrid_diffusion_augmented.pt
  train_end_step: 34
  val_end_step: 41

diffusion:
  num_timesteps: 1000
  hidden_dim: 128
  lr: 0.001
  epochs: 1000
  batch_size: 256
  log_every: 25
  model_path: models/diffusion/tabddpm_elliptic_gnn_rf_hybrid.pt

augment:
  n_synthetic: 1731
  sampler: ddim
  ddim_steps: 100
  clamp_std: 3.0
  k_connections: 5
  attach_to: all

# GNN-embeddings+RF hybrid (Run 53, F1=0.7745 without diffusion) combined with the best-known
# diffusion recipe (alpha=0.75, n_synthetic=1731, ddim_steps=100) -- untested combination.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

loss:
  name: focal
  alpha: 0.75
  gamma: 2.0

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  ema_decay: 0.98
  ema_start_epoch: 30

hybrid:
  enabled: true
  n_estimators: 300

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_graphsage_diff_rf_hybrid_diffusion
