seed: 42

data:
  dataset: elliptic
  raw_dir: data/raw/elliptic/elliptic_bitcoin_dataset
  processed_path: data/processed/elliptic_graph.pt
  train_end_step: 34
  val_end_step: 41

# GraphSAGEDualView (HOT-GNN-inspired decoupled homophily/heterophily aggregation, see
# models/gnn/graphsage.py) + camo-weighted metric learning -- combines this project's own
# confirmed lever (camo-weighted mining) with a real published anti-fraud architecture's core
# innovation (decoupled multi-view message passing), instead of another loss-formula variant.
# Genuinely different aggregation mechanism from GraphSAGECamoAgg (single external-centroid
# weight) and GraphSAGEGated (single learned scalar gate, no effect) -- two pairwise-similarity-
# based channels (homophilic + heterophilic), no external reference point needed.
model:
  name: graphsage_dual_view
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto

metric_learning:
  enabled: true
  margin: 1.0
  mining: camo_weighted

journal:
  path: LAB_JOURNAL.md
  run_name: elliptic_metric_learning_dual_view
