seed: 42

data:
  dataset: ieee_cis
  transaction_csv: data/raw/ieee_cis/train_transaction.csv
  identity_csv: data/raw/ieee_cis/train_identity.csv
  processed_path: data/processed/ieee_cis_graph_full_v3_fixed.pt
  subsample_size: null
  max_node_degree: 20
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  uid_features: true
  uid_graph: true

# Camo-weighted metric learning baseline on the LEAK-FIXED richer graph (V-columns + out-of-fold
# UID target encoding) -- ieee_cis_metric_learning_camo_weighted.yaml used the plain pre-V-column
# graph, ieee_cis_metric_learning_full.yaml used the richer v2 (pre-leak-fix) graph with random
# mining. This is the valid current baseline for comparing GraphSAGEDualView against.
model:
  name: graphsage_diff
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5

train:
  lr: 0.001
  weight_decay: 0.00001
  epochs: 1000
  patience: 50
  device: auto
  mini_batch: true
  batch_size: 1024
  num_neighbors: [15, 10]

metric_learning:
  enabled: true
  margin: 1.0
  mining: camo_weighted
  return_embeddings: false
  legit_ref_size: 3000

journal:
  path: LAB_JOURNAL.md
  run_name: ieee_cis_metric_learning_camo_weighted_v3fixed
